<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WestCoast Education – Kontakt</title>
    <link rel="stylesheet" href="src/assets/styles.css" />
  </head>
  <body>
    <nav>
      <a href="index.html" class="nav-brand">
        <img src="src/assets/logo.svg" alt="Logo" class="nav-logo" />
        <span>Westcoast Education</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Kurser</a>
        <a href="classrooms.html">Klassrum</a>
        <a href="about.html">Om oss</a>
        <a href="contact.html">Kontakt</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Logga in</a>
      </div>
    </nav>
    <main>
      <div class="form-container">
        <h1>Kontakta oss</h1>
        <form id="contact-form">
          <div>
            <label for="name">Namn</label>
            <input type="text" id="name" name="name" />
          </div>
          <div>
            <label for="email">E-post</label>
            <input type="email" id="email" name="email" />
          </div>
          <div>
            <label for="message">Meddelande</label>
            <textarea id="message" name="message" rows="5"></textarea>
          </div>
          <button type="submit">Skicka</button>
        </form>
      </div>
    </main>
    <script type="module">
      import { setupNavAuth } from "./dist/utils/navAuth.js";
      import { setupContactForm } from "./dist/pages/contact.js";
      setupNavAuth();
      setupContactForm();
    </script>
  </body>
</html>
