<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WestCoast Education – Logga in</title>
    <link rel="stylesheet" href="src/assets/styles.css" />
  </head>
  <body>
    <nav>
      <a href="index.html" class="nav-brand">
        <img src="src/assets/logo.svg" alt="Logo" class="nav-logo" />
        <span>Westcoast Education</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Kurser</a>
        <a href="classrooms.html">Klassrum</a>
        <a href="about.html">Om oss</a>
        <a href="contact.html">Kontakt</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Logga in</a>
      </div>
    </nav>
    <main>
      <div class="form-container">
        <div id="login-section">
          <h1>Logga in</h1>
          <form id="login-form">
            <div>
              <label for="login-email">E-postadress</label>
              <input type="email" id="login-email" name="email" />
            </div>
            <div>
              <label for="login-password">Lösenord</label>
              <input type="password" id="login-password" name="password" />
            </div>
            <button type="submit">Logga in</button>
          </form>
          <p class="auth-toggle">
            Har du inget konto?
            <a href="#" id="show-register">Skapa konto</a>
          </p>
        </div>

        <div id="register-section" class="hidden">
          <h1>Skapa konto</h1>
          <form id="register-form">
            <div>
              <label for="reg-name">Namn</label>
              <input type="text" id="reg-name" name="name" />
            </div>
            <div>
              <label for="reg-email">E-postadress</label>
              <input type="email" id="reg-email" name="email" />
            </div>
            <div>
              <label for="reg-password">Lösenord</label>
              <input type="password" id="reg-password" name="password" />
            </div>
            <div>
              <label for="reg-confirm">Bekräfta lösenord</label>
              <input type="password" id="reg-confirm" name="confirmPassword" />
            </div>
            <button type="submit">Skapa konto</button>
          </form>
          <p class="auth-toggle">
            Har du redan ett konto?
            <a href="#" id="show-login">Logga in</a>
          </p>
        </div>
      </div>
    </main>
    <footer class="site-footer">copywrite @ AArwid</footer>
    <script type="module">
      import { setupNavAuth } from "./dist/utils/navAuth.js";
      import { setupLoginPage } from "./dist/pages/login.js";
      setupNavAuth();
      setupLoginPage();
    </script>
  </body>
</html>
